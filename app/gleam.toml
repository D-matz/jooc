name = "jooc"
version = "1.0.0"
target = "javascript"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
lustre_dev_tools = ">= 2.4.0 and < 3.0.0"
gleam_javascript = ">= 1.0.1 and < 2.0.0"
rsvp = ">= 2.0.0 and < 3.0.0"
gleam_hexpm = ">= 3.0.1 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
shared = {path = "../shared"}
gleam_http = ">= 4.5.0 and < 5.0.0"
timeago = ">= 2.5.0 and < 3.0.0"
edit_distance = ">= 3.0.1 and < 4.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
modem = ">= 2.1.3 and < 3.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"

[tools.lustre.html]
scripts = [{ src = "/static/jooc/sqlite3-worker1-promiser.js" }]
stylesheets = [{ href = "/static/jooc/jooc.css" }]
title = "Gleam packages that spark joy"
meta = [
  { name = "description", content = "Filtered list of Gleam packages. Search by name, code, type, or function" },
  { name = "keywords", content = "Gleam, package, search, type, function, code, spark, joy" },
  { property = "og:title", content = "Gleam packages that spark joy" },
  { property = "og:description", content = "Filtered list of Gleam packages. Search by name, code, type, or function" },
  { property = "og:image", content = "https://correctarity.com/static/jooc/sparkjoy.jpg" },
  { property = "og:image:type", content = "image/jpg" },
]
links = [
  { rel = "icon", href = "/static/lucy_square.svg", type = "image/svg+xml" },
]